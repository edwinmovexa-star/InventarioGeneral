<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso | Inventario Noventia</title>
  <link rel="stylesheet" href="/styles.css" >
</head>
<body>
  <main class="card">
    <div style="text-align: center;">
      <img src="logo.JPG" alt="Logo" style="width: 200px; height:auto; max-width:100%;">
    </div>
    <!-- <div class="marca">NOVENTIA</div> -->
    <p class="tag">Sistema interno de inventario</p>
    <form id="loginForm">
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required>
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" autocomplete="current-password" required>
      <button id="entrar" type="submit">Iniciar sesión</button>
      <div id="mensaje" class="msg" aria-live="polite"></div>
    </form>
    <div class="nota">El administrador entra al actualizador. El usuario general entra únicamente a la consulta.</div>
  </main>
  <script type="module">
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { auth, db } from "./js/firebase.js";

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("entrar");
    const mensaje = document.getElementById("mensaje");

    async function redirigir(usuario) {
      const snap = await getDoc(doc(db, "usuarios", usuario.uid));
      if (!snap.exists() || snap.data().activo === false) throw new Error("Tu cuenta no tiene un perfil activo.");
      const rol = snap.data().rol;
      window.location.replace(rol === "admin" ? "./consulta/index.html" : "./actualizador/index.html");
    }

    onAuthStateChanged(auth, async (usuario) => {
      if (!usuario) return;
      try { await redirigir(usuario); } catch (error) { mensaje.textContent = error.message; }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); mensaje.textContent = ""; btn.disabled = true; btn.textContent = "Validando...";
      try {
        const credencial = await signInWithEmailAndPassword(auth, correo.value.trim(), contrasena.value);
        await redirigir(credencial.user);
      } catch (error) {
        const mensajes = {
          "auth/invalid-credential": "Correo o contraseña incorrectos.",
          "auth/too-many-requests": "Demasiados intentos. Espera unos minutos.",
          "auth/user-disabled": "Esta cuenta fue desactivada."
        };
        mensaje.textContent = mensajes[error.code] || error.message || "No fue posible iniciar sesión.";
        btn.disabled = false; btn.textContent = "Iniciar sesión";
      }
    });
  </script>
</body>
</html>
